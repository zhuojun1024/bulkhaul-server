server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: bulkhaul-server
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/blms?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:blms}
    # 生产必须经环境变量 DB_PASSWORD 注入（勿提交真实密码）；dev 默认值仅供本地/测试
    password: ${DB_PASSWORD:blms123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

blms:
  jwt:
    # 生产必须经环境变量 JWT_SECRET 注入（≥32 字节，勿提交真实密钥）；dev 默认值仅供本地/测试
    secret: ${JWT_SECRET:blms-demo-secret-key-change-me-0123456789abcdef}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  scheduler:
    # 自动轮询开关；默认关闭（验证/演示环境确定性运行，前端联调时前端自己轮询 /api/scheduler/tick）。
    # 生产开启服务端定时（C4）：--blms.scheduler.auto-enabled=true 或 env SCHEDULER_AUTO_ENABLED=true
    auto-enabled: ${SCHEDULER_AUTO_ENABLED:false}

logging:
  level:
    com.blms: ${LOG_LEVEL_COM_BLMS:info}
