server:
  port: 8081

spring:
  application:
    name: bulkhaul-server
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/blms?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: blms
    password: blms123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

blms:
  jwt:
    # 演示环境密钥；生产必须外置
    secret: blms-demo-secret-key-change-me-0123456789abcdef
    ttl-minutes: 480
  scheduler:
    # 自动轮询开关；默认关闭（验证/演示环境确定性运行，前端联调时前端自己轮询 /api/scheduler/tick）。
    # 需要后台自动心跳时：--blms.scheduler.auto-enabled=true
    auto-enabled: false

logging:
  level:
    com.blms: info
