# 生产 profile（-Dspring.profiles.active=prod 或 SPRING_PROFILES_ACTIVE=prod 启用）。
# 敏感项必须经环境变量注入，本文件不提供 dev 默认值（缺省即启动失败，避免误用演示密钥上线）。
server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

blms:
  jwt:
    secret: ${JWT_SECRET}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  scheduler:
    auto-enabled: ${SCHEDULER_AUTO_ENABLED:true}
  rate-limit:
    # A3 全局限流（生产严格）：登录/验证码 10/min/IP（防刷登录/验证码）；写端点 100/min/用户（防单账号高频写）。
    # 超限 429 + Retry-After；Redis 不可用 fail-open（不阻断业务）。
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:10}
    write-per-minute: ${RATE_LIMIT_WRITE_PER_MINUTE:100}
  cors:
    # C5 CORS 白名单（生产）：默认空 = 不做 CORS 处理（Nginx 反代同源部署直通，跨域由浏览器同源策略限制）；
    # 仅当前端与后端不同源（独立域名）时，经 CORS_ALLOWED_ORIGINS 注入前端域名（如 https://blms.example.com）→ 启用 CORS 强制。
    # 注：反代会转发 Origin 同时改写 Host，后端默认拒绝跨域会误伤同源反代（登录 403），故采用白名单显式启用（opt-in）。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  openapi:
    # D1 OpenAPI/Swagger（生产）：默认 false 需认证（不暴露 API 面）；如需内部文档访问，经 OPENAPI_PUBLIC=true 放开（仍走 JWT 认证）。
    public: ${OPENAPI_PUBLIC:false}

logging:
  level:
    com.blms: ${LOG_LEVEL_COM_BLMS:info}
