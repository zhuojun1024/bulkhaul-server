name: backend-ci

# C2：后端 CI（GitHub Actions）。push/PR 到 master 触发：
#   起 mysql:8（建 blms_test 库）+ redis:7 service → mvn test（Flyway V1-V4 建表灌种子 + 159 断言）。
# 测试库经 TEST_DB_* 环境变量指向 service 容器（application-test.yml 占位符，本地默认值不变）。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: 集成测试（MySQL + Redis）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: blms_test
          MYSQL_USER: blms
          MYSQL_PASSWORD: blms123456
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=30s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      # 指向 service 容器（GitHub Actions service 经 127.0.0.1 映射端口可达）
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/blms_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      TEST_DB_USERNAME: blms
      TEST_DB_PASSWORD: blms123456
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      - name: 运行集成测试（mvn test）
        run: mvn -B test

      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
